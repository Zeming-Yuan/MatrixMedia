name: PR Check

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - prod

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      npm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Install isolated DOM test tools
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/matrixmedia-test-tools" --no-audit --no-fund --ignore-scripts playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/matrixmedia-test-tools/node_modules" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/matrixmedia-test-tools/node_modules/playwright/cli.js" install --with-deps chromium
      # 部分被测模块引用 telemetrySecret.generated.js（gitignore 的本地生成物）
      - name: Generate telemetry secret
        run: node scripts/gen-telemetry-secret.js
      - name: Configure Linux Electron sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Build app and install MCP dependencies
        run: |
          yarn build:dir
          npm ci --prefix mcp --ignore-scripts
      - name: Run Windows release gates
        if: runner.os == 'Windows'
        run: yarn test:release --with-gui
      - name: Run Linux release gates
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a yarn test:release --with-gui
      - name: Run native MCP tests
        run: yarn --cwd mcp test
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-${{ runner.os }}
          path: |
            test/.cache/release/
            test/.cache/waiting-confirmation/gui-*
